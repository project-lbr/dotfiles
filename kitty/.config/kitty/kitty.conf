# ==============================================================================
# KITTY CONFIGURATION - ThinkPad X390 (EndeavourOS)
# ==============================================================================

# --- FONT (Required for icons & powerline) ---
font_family      JetBrainsMono Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        15.0

# --- APPEARANCE & DISPLAY ---
background_opacity       0.80
background_blur          32
hide_window_decorations  yes
window_padding_width     6 8

# Cursor behavior
cursor_shape             beam
cursor_blink_interval    0

# URLs
detect_urls              yes
open_url_with            default
url_style                curly

# --- SYSTEM & EXTENSIONS ---
enable_audio_bell        no
# Desktop notification when a command longer than 5 s finishes in an unfocused window
notify_on_cmd_finish     unfocused 5.0
allow_remote_control     yes

# --- TILING & LAYOUTS ---
# Layouts: Tall (main left, rest right), Grid, Fat (main top)
enabled_layouts          tall,grid,fat
window_border_width      1.5pt
inactive_text_alpha      0.7

# --- SHORTCUTS & WINDOW MANAGEMENT ---
# Navigation between windows
map ctrl+shift+left  neighboring_window left
map ctrl+shift+right neighboring_window right
map ctrl+shift+up    neighboring_window up
map ctrl+shift+down  neighboring_window down

# Resizing windows (Alt + Arrow keys)
map alt+left  resize_window narrower
map alt+right resize_window wider
map alt+up    resize_window taller
map alt+down  resize_window shorter

# --- TABS ---
# Styling
tab_bar_style        powerline
tab_powerline_style  round

# Navigation & Management (Ctrl + Tab like in browser)
map ctrl+tab         next_tab
map ctrl+shift+tab   previous_tab
map ctrl+shift+e     set_tab_title
map ctrl+shift+t     combine : new_tab : set_tab_title

# ==============================================================================
# THEME: Catppuccin Mocha
# ==============================================================================

# The basic colors
foreground              #cdd6f4
background              #1e1e2e
selection_foreground    #1e1e2e
selection_background    #f5e0dc

# Cursor colors
cursor                  #f5e0dc
cursor_text_color       #1e1e2e

# Scrollbar colors
scrollbar_handle_color  #9399b2
scrollbar_track_color   #45475a

# URL color when hovering with mouse
url_color               #f5e0dc

# Kitty window border colors
active_border_color     #f9e2af
inactive_border_color   #6c7086
bell_border_color       #f9e2af

# OS Window titlebar colors
wayland_titlebar_color  system
macos_titlebar_color    system

# Tab bar colors
active_tab_foreground   #11111b
active_tab_background   #cba6f7
inactive_tab_foreground #cdd6f4
inactive_tab_background #181825
tab_bar_background      #11111b

# Colors for marks (marked text in the terminal)
