[mgr]
prepend_keymap = [
    { on = "z", run = "plugin zoxide", desc = "Jump to directory via zoxide" },
    { on = "Z", run = "plugin fzf",    desc = "Jump to directory via fzf" },
    { on = [ "g", "o" ], run = "shell 'xdg-open .' --orphan", desc = "Open current directory in GUI file manager" },
    { on = [ "g", "l" ], run = "shell 'lazygit' --block", desc = "Open lazygit in current directory" },
    { on = "<C-y>", run = "plugin wl-clipboard", desc = "Copy selected files to system clipboard" },
  # Tab switching on a Czech keyboard layout (+, ě, š, č, ř, ž, ý, á, í)
    { on = "+", run = "tab_switch 0", desc = "Switch to first tab" },
    { on = "ě", run = "tab_switch 1", desc = "Switch to second tab" },
    { on = "š", run = "tab_switch 2", desc = "Switch to third tab" },
    { on = "č", run = "tab_switch 3", desc = "Switch to fourth tab" },
    { on = "ř", run = "tab_switch 4", desc = "Switch to fifth tab" },
    { on = "ž", run = "tab_switch 5", desc = "Switch to sixth tab" },
    { on = "ý", run = "tab_switch 6", desc = "Switch to seventh tab" },
    { on = "á", run = "tab_switch 7", desc = "Switch to eighth tab" },
    { on = "í", run = "tab_switch 8", desc = "Switch to ninth tab" },
]
